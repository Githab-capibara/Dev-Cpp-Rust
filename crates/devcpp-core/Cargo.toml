[package]
repository = "https://github.com/Githab-capibara/Dev-Cpp-Rust"
keywords = ["ide", "c", "cpp", "gtk4", "dev-cpp"]
categories = ["development-tools"]
name = "devcpp-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Headless core of the devcpp IDE: project files, makefile generation, toolchain detection, build runner, diagnostics, GDB/MI debugger, symbol index, templates, tools, config."

[lib]
path = "src/lib.rs"

[dependencies]
thiserror.workspace = true
serde.workspace = true
toml.workspace = true
regex.workspace = true
dirs.workspace = true
which.workspace = true
crossbeam-channel.workspace = true
tree-sitter.workspace = true
tree-sitter-c.workspace = true
tree-sitter-cpp.workspace = true

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"

[lints]
workspace = true
