[workspace]
resolver = "2"
members = ["crates/devcpp-core", "crates/devcpp-cli", "crates/devcpp-gtk"]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
authors = ["Dev-C++ Rust Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Githab-capibara/Dev-Cpp-Rust"

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
cargo = "warn"

# Strict profile, enabled on demand:
#   cargo clippy --workspace --all-targets -- -W clippy::pedantic
# The default profile stays warning-free so that `clippy -D warnings` is a
# meaningful gate.
[workspace.lints.clippy.pedantic]
level = "allow"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "1"
regex = "1"
dirs = "6"
which = "8"
crossbeam-channel = "0.5"
tree-sitter = "0.27"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
debug = 1
incremental = true